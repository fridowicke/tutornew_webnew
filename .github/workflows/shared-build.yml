# Reusable workflow for building Eleventy sites
name: Shared Eleventy Build

on:
  workflow_call:
    inputs:
      site_name:
        required: true
        type: string
        description: 'Site name (tutor.new or open.tutor.new)'
      input_dir:
        required: true
        type: string
        description: 'Input directory for Eleventy'
      output_dir:
        required: true
        type: string
        description: 'Output directory for Eleventy build'
      config_file:
        required: true
        type: string
        description: 'Eleventy config file path'
    outputs:
      artifact_path:
        description: 'Path to the build artifact'
        value: ${{ jobs.build.outputs.artifact_path }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_path: ${{ steps.set-output.outputs.artifact_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ inputs.site_name }}
        working-directory: ${{ github.workspace }}/$(dirname ${{ inputs.config_file }})
        run: |
          npx @11ty/eleventy --config=$(basename ${{ inputs.config_file }})

      - name: Verify build output
        run: |
          if [ ! -d "${{ inputs.output_dir }}" ]; then
            echo "Error: Build output directory ${{ inputs.output_dir }} does not exist"
            exit 1
          fi
          if [ -z "$(ls -A ${{ inputs.output_dir })" ]; then
            echo "Error: Build output directory ${{ inputs.output_dir }} is empty"
            exit 1
          fi
          echo "✓ Build successful: $(find ${{ inputs.output_dir }} -type f | wc -l) files generated"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ inputs.site_name }}
          path: ${{ inputs.output_dir }}
          retention-days: 1

      - name: Set output
        id: set-output
        run: echo "artifact_path=${{ inputs.output_dir }}" >> $GITHUB_OUTPUT

