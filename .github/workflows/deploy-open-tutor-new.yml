name: Deploy open.tutor.new

on:
  push:
    branches:
      - main
    paths:
      - 'sites/open.tutor.new/**'
      - 'shared/**'
      - '.github/workflows/deploy-open-tutor-new.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# IMPORTANT: For open.tutor.new to deploy to a separate repository:
# 1. Create a separate repository (e.g., fridowicke/open-tutor-new)
# 2. Generate a Personal Access Token (PAT) with 'repo' scope
# 3. Add it as a secret in THIS repository: OPEN_TUTOR_NEW_DEPLOY_TOKEN
# 4. Uncomment the external_repository line below and update the repo name

concurrency:
  group: "pages-open-tutor-new"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build open.tutor.new
        run: |
          cd sites/open.tutor.new
          npx @11ty/eleventy --config=.eleventy.js

      - name: Verify build output
        run: |
          if [ ! -d "_site-open-tutor-new" ]; then
            echo "Error: Build output directory _site-open-tutor-new does not exist"
            exit 1
          fi
          if [ -z "$(ls -A _site-open-tutor-new)" ]; then
            echo "Error: Build output directory _site-open-tutor-new is empty"
            exit 1
          fi
          echo "✓ Build successful: $(find _site-open-tutor-new -type f | wc -l) files generated"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-open.tutor.new
          path: _site-open-tutor-new
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PAT secret exists
        run: |
          if [ -z "${{ secrets.OPEN_TUTOR_NEW_DEPLOY_TOKEN }}" ]; then
            echo "::error::OPEN_TUTOR_NEW_DEPLOY_TOKEN secret is not set. Please add it in repository settings."
            exit 1
          fi
          # Verify it's not empty (basic check - token should start with ghp_)
          TOKEN="${{ secrets.OPEN_TUTOR_NEW_DEPLOY_TOKEN }}"
          if [[ ! "$TOKEN" =~ ^ghp_ ]]; then
            echo "::error::OPEN_TUTOR_NEW_DEPLOY_TOKEN appears to be invalid (should start with ghp_)"
            exit 1
          fi
          echo "✓ PAT secret is configured and appears valid"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-open.tutor.new
          path: _site-open-tutor-new

      - name: Deploy to open.tutor.new repository
        env:
          GITHUB_TOKEN: ${{ secrets.OPEN_TUTOR_NEW_DEPLOY_TOKEN }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          # MUST use PAT for deploying to external repository
          # GITHUB_TOKEN does not work for external repositories
          personal_token: ${{ secrets.OPEN_TUTOR_NEW_DEPLOY_TOKEN }}
          publish_dir: _site-open-tutor-new
          # Deploy to separate repository
          external_repository: fridowicke/open-tutor-new

